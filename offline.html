<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Grid - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container { max-width: 400px; }
        .icon { font-size: 80px; margin-bottom: 20px; display: block; }
        h2 { font-size: 24px; margin-bottom: 12px; }
        p { color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 8px; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: scale(0.95); }
        .game-stats {
            margin: 20px 0;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .game-stats .stat {
            display: inline-block;
            margin: 0 16px;
        }
        .game-stats .stat .num {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .game-stats .stat .label {
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">📶</span>
        <h2>No Internet Connection</h2>
        <p>Please reconnect to continue playing Memory Grid.</p>
        
        <div class="game-stats">
            <div class="stat">
                <div class="num">🎮</div>
                <div class="label">Game Paused</div>
            </div>
            <div class="stat">
                <div class="num">📸</div>
                <div class="label">Camera Ready</div>
            </div>
        </div>
        
        <p style="font-size:12px;color:rgba(255,255,255,0.3);">
            Your progress will be saved when you reconnect
        </p>
        
        <button class="btn" onclick="location.reload()">🔄 Retry Connection</button>
    </div>
</body>
</html>
